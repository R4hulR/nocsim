// Matched to nocsim's validation configuration (see experiments/05_booksim_validation.py)
topology = mesh;
k = 8;
// 1-cycle links for both topologies (BookSim otherwise models a folded torus
// with 2-cycle links), matching nocsim's link_latency="unit".
use_noc_latency = 0;
n = 2;
routing_function = dim_order;
num_vcs = 2;
vc_buf_size = 4;
wait_for_tail_credit = 0;
vc_allocator = separable_input_first;
sw_allocator = separable_input_first;
alloc_iters = 1;
credit_delay = 0;
routing_delay = 0;
vc_alloc_delay = 1;
sw_alloc_delay = 1;
st_final_delay = 1;
input_speedup = 1;
output_speedup = 1;
internal_speedup = 1.0;
traffic = uniform;
packet_size = 1;
injection_process = bernoulli;
sim_type = latency;
injection_rate = 0.01;
sample_period = 1000;
warmup_periods = 3;
max_samples = 10;
latency_thres = 500.0;
seed = 1;
